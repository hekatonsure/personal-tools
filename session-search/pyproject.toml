[project]
name = "session-search"
version = "0.1.0"
description = "Plain-English search over Claude Code + Codex sessions, ranked by Jev"
readme = "README.md"
authors = [
    { name = "Hek Li", email = "hekatonsure@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=1.32.0",
    "model2vec>=0.9.0",
    "numpy>=2.5.3",
    "orjson>=3.12.0",
]

[project.scripts]
session-search = "session_search:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
