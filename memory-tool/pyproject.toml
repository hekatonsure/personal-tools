[project]
name = "memory-tool"
version = "0.2.0"
description = "Durable chat memory with bounded prompts and verified working-context resets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["tiktoken>=0.12.0", "httpx>=0.28.1"]

[project.scripts]
memory-tool = "memory_tool.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
